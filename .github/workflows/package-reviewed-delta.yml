name: Package verified public app archives as a delta (no build or deployment)
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: geoinflow-public-archive-delta
  cancel-in-progress: false
jobs:
  package:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      BASE_TAG: build-6ba7c79d8d26-41787092963-1
      TARGET_TAG: patch-6ba7c79d8d26-42002605703-1
      BASE_SHA: fcafc1e654e99d2cf58532011e9fa92a34f9bb89ae81058ef7bd6bb40493ce18
      TARGET_SHA: 23f46bedc6b035fbfba51781d6613886a4f213d1f137b5f25e2d32edc2d47e30
    steps:
    - name: Fetch only reviewed packaging code and two exact public release assets
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        mkdir config input

        git -C config init -q

        git -C config remote add origin "https://github.com/$GITHUB_REPOSITORY.git"

        git -C config fetch -q --depth=1 origin "$GITHUB_SHA"

        git -C config checkout -q --detach FETCH_HEAD

        gh release download "$BASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-rootfs.tar.xz --dir input

        gh release download "$TARGET_TAG" --repo "$GITHUB_REPOSITORY" --pattern app-rootfs.tar.gz --pattern build-records.json --pattern patch-series.json --dir input

        printf ''%s  %s\n'' "$BASE_SHA" input/app-rootfs.tar.xz "$TARGET_SHA" input/app-rootfs.tar.gz ''2c79fd7ea43ba3e7a08471adf11ec0f6a6578635c3a868fc25bacce14ed9ffc9'' input/build-records.json ''04c98f445e01d9f0f76cb3fc84e0f213497fe42c6c7b48b550e927729649e009'' input/patch-series.json | sha256sum --check

        '
    - name: Verify build gates and package all changed bytes with complete target manifest
      shell: bash
      run: "set -euo pipefail\npython3 - <<'CHECK'\nimport hashlib,json\nfrom pathlib import Path\nr=json.loads(Path('input/build-records.json').read_text())\nfor k,v in r.items():\n  b=v['text'].encode();assert len(b)==v['bytes'] and hashlib.sha256(b).hexdigest()==v['sha256'],k\nassert r['source-commit.txt']['text'].strip()=='6ba7c79d8d263ff620911fdccd90dd90be85dfb7'\nassert r['runtime3-probe-outcome.txt']['text'].strip()=='success'\nassert r['runtime3-probe-exit.txt']['text'].strip()=='0'\nt=json.loads(r['targeted-tests.json']['text']);assert t['success'] and t['numPassedTests']>=396 and t['numFailedTests']==0 and t['numPendingTests']==0\npg=json.loads(r['observation-pg-tests.json']['text']);assert pg['success'] and pg['numFailedTests']==0 and pg['numPassedTests']==2\nnames=[a['fullName'] for s in pg['testResults'] for a in s['assertionResults'] if a['status']=='passed']\nassert any('matches exact raw log populations' in x for x in names) and any('keeps today static errors' in x for x in names)\nassert int(r['app-rootfs-uncompressed-bytes.txt']['text'])<4*1024**3\nassert len(json.loads(Path('input/patch-series.json').read_text())['patches'])==12\nCHECK\npython3 config/ci/package-rootfs-delta.py --base input/app-rootfs.tar.xz --target input/app-rootfs.tar.gz --output output --base-sha256 \"$BASE_SHA\" --target-sha256 \"$TARGET_SHA\" --target-build-run 42002605703\n"
    - name: Publish verified delta under a new immutable release
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: 'set -euo pipefail

        tag="delta-42002605703-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

        printf ''%s\n'' ''Content-preserving transport of two already public, hash-pinned app archives. Full target manifest records every file, mode, owner, symlink and hardlink. Delta includes only changed regular-file bytes; unchanged source files must be verified and copied into a new independent root. The target is the successful 396-test patched build with two selected PostgreSQL scenarios, not a new build. No deployment or production data is involved. Parts must be concatenated in listed order and hash-verified before use.'' > "$RUNNER_TEMP/delta-notes.txt"

        gh release create "$tag" output/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title ''Verified app archive delta for build 42002605703'' --notes-file "$RUNNER_TEMP/delta-notes.txt"

        '


