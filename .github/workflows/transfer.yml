name: Transfer verified compressed runtime to temporary receiver
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: geoinflow-artifact-transfer
  cancel-in-progress: false
jobs:
  transfer:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Download and verify unchanged compressed rootfs
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 --max-time 600 'https://github.com/edwaryhu/geoinflow-build/releases/download/build-6ba7c79d8d26-41787092963-1/app-rootfs.tar.xz' -o app-rootfs.tar.xz
          printf '%s\n' 'fcafc1e654e99d2cf58532011e9fa92a34f9bb89ae81058ef7bd6bb40493ce18  app-rootfs.tar.xz' | sha256sum --check
      - name: Send checksummed runtime over HTTPS
        env:
          TRANSFER_TOKEN: ${{ secrets.GEOINFLOW_TRANSFER_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TRANSFER_TOKEN"
          curl --fail --silent --show-error --request PUT --header "Authorization: Bearer $TRANSFER_TOKEN" --connect-timeout 20 --max-time 3600 --upload-file app-rootfs.tar.xz --dump-header "$RUNNER_TEMP/receipt-app.txt" 'https://geo.azuaiai.com/_runtime-transfer/artifacts/app-rootfs.tar.xz'
          grep -i '^X-Artifact-' "$RUNNER_TEMP/receipt-app.txt"
